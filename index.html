<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="法律文档总目录：按游戏分批存放的隐私政策与用户服务协议">
  <meta name="theme-color" content="#1e293b">

  <!-- Open Graph / GitHub Pages 分享卡片 -->
  <meta property="og:title" content="法律文档">
  <meta property="og:description" content="按游戏分册的隐私政策与用户服务协议">
  <meta property="og:type" content="website">

  <title>法律文档</title>
  <style>
    /* ═══════════════════════════════════════
       变量 & 重置
       ═══════════════════════════════════════ */
    :root {
      --sidebar-width: 260px;
      --color-bg: #f8f9fa;
      --color-sidebar: #1e293b;
      --color-sidebar-text: #cbd5e1;
      --color-sidebar-hover: rgba(255, 255, 255, 0.08);
      --color-sidebar-active: #3b82f6;
      --color-text: #1e293b;
      --color-text-secondary: #64748b;
      --color-border: #e2e8f0;
      --color-card: #ffffff;
      --color-link: #3b82f6;
      --color-accent-soft: #eff6ff;
      --max-content-width: 800px;
      --transition-speed: 0.2s;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial,
        sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.8;
      display: flex;
      min-height: 100vh;
    }

    /* ═══════════════════════════════════════
       Sidebar
       ═══════════════════════════════════════ */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--color-sidebar);
      color: var(--color-sidebar-text);
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      overflow-y: auto;
      z-index: 10;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 24px 20px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .sidebar-header h2 {
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .sidebar-header p {
      font-size: 12px;
      margin-top: 4px;
      opacity: 0.6;
    }

    .sidebar-nav {
      flex: 1;
      list-style: none;
      padding: 8px 12px;
    }

    .sidebar-nav li {
      margin-bottom: 2px;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      color: var(--color-sidebar-text);
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      transition: background var(--transition-speed) ease, color var(--transition-speed) ease;
    }

    .sidebar-nav a:hover {
      background: var(--color-sidebar-hover);
      color: #ffffff;
    }

    .sidebar-nav a.active {
      background: var(--color-sidebar-active);
      color: #ffffff;
    }

    /* 导航图标（可选装饰） */
    .sidebar-nav a::before {
      content: "📄";
      font-size: 13px;
      opacity: 0.6;
    }
    .sidebar-nav a.active::before {
      opacity: 1;
    }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 11px;
      opacity: 0.45;
      flex-shrink: 0;
    }

    /* ═══════════════════════════════════════
       Main content area
       ═══════════════════════════════════════ */
    .main {
      margin-left: var(--sidebar-width);
      flex: 1;
      min-width: 0;
    }

    .content {
      max-width: var(--max-content-width);
      margin: 0 auto;
      padding: 40px 32px 80px;
    }

    /* ═══════════════════════════════════════
       Markdown 渲染内容
       ═══════════════════════════════════════ */
    .markdown-body h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #0f172a;
      border-bottom: 2px solid var(--color-border);
      padding-bottom: 12px;
    }

    .markdown-body h2 {
      font-size: 22px;
      font-weight: 600;
      margin-top: 36px;
      margin-bottom: 12px;
      color: #1e293b;
    }

    .markdown-body h3 {
      font-size: 18px;
      font-weight: 600;
      margin-top: 28px;
      margin-bottom: 8px;
      color: #334155;
    }

    .markdown-body p {
      margin-bottom: 12px;
    }

    .markdown-body ul,
    .markdown-body ol {
      margin-bottom: 12px;
      padding-left: 24px;
    }

    .markdown-body li {
      margin-bottom: 4px;
    }

    .markdown-body li > p {
      margin-bottom: 0;
    }

    .markdown-body strong {
      font-weight: 600;
    }

    .markdown-body em {
      font-style: italic;
    }

    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 32px 0;
    }

    .markdown-body blockquote {
      border-left: 3px solid var(--color-sidebar-active);
      padding: 8px 16px;
      margin: 16px 0;
      color: var(--color-text-secondary);
      background: var(--color-accent-soft);
      border-radius: 0 6px 6px 0;
    }

    .markdown-body a {
      color: var(--color-link);
      text-decoration: none;
    }

    .markdown-body a:hover {
      text-decoration: underline;
    }

    .markdown-body code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    .markdown-body pre {
      background: #1e293b;
      color: #e2e8f0;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.5;
    }

    .markdown-body pre code {
      background: transparent;
      padding: 0;
      color: inherit;
      font-size: inherit;
    }

    /* ═══════════════════════════════════════
       元信息栏（版本 / 日期）
       ═══════════════════════════════════════ */
    .meta-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .meta-bar span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 3px 12px;
      font-size: 13px;
      color: var(--color-text-secondary);
      white-space: nowrap;
    }

    .meta-bar span::before {
      font-size: 14px;
    }
    .meta-bar .meta-version::before { content: "🏷️ "; }
    .meta-bar .meta-date::before    { content: "📅 "; }

    /* ═══════════════════════════════════════
       状态提示
       ═══════════════════════════════════════ */
    .info-banner {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #92400e;
      line-height: 1.6;
    }

    .info-banner code {
      background: #fde68a;
      padding: 1px 6px;
      border-radius: 3px;
      font-weight: 600;
      font-size: 0.95em;
    }

    .loading, .error-msg {
      text-align: center;
      padding: 80px 20px;
    }

    .loading {
      color: var(--color-text-secondary);
    }

    .loading::after {
      content: "";
      display: inline-block;
      width: 20px;
      height: 20px;
      margin-left: 8px;
      border: 2px solid var(--color-border);
      border-top-color: var(--color-sidebar-active);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-msg {
      color: #dc2626;
    }

    .error-msg code {
      background: #fef2f2;
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* ═══════════════════════════════════════
       移动端：汉堡菜单
       ═══════════════════════════════════════ */
    .menu-toggle {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 20;
      background: var(--color-sidebar);
      color: #fff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      transition: background var(--transition-speed) ease;
    }

    .menu-toggle:hover {
      background: #334155;
    }

    .menu-toggle:focus-visible {
      outline: 2px solid var(--color-sidebar-active);
      outline-offset: 2px;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 9;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .overlay.show {
      display: block;
      opacity: 1;
    }

    /* ═══════════════════════════════════════
       响应式
       ═══════════════════════════════════════ */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .menu-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .main {
        margin-left: 0;
      }

      .content {
        padding: 56px 16px 40px;
      }

      .markdown-body h1 {
        font-size: 22px;
      }

      .markdown-body h2 {
        font-size: 18px;
      }
    }

    /* ═══════════════════════════════════════
       打印样式
       ═══════════════════════════════════════ */
    @media print {
      .sidebar, .menu-toggle, .overlay, .info-banner {
        display: none !important;
      }
      .main {
        margin-left: 0;
      }
      .content {
        padding: 20px;
        max-width: none;
      }
      body {
        background: #fff;
      }
    }

    /* ═══════════════════════════════════════
       平滑页面切换（内容区域淡入）
       ═══════════════════════════════════════ */
    .fade-in {
      animation: fadeIn 0.25s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ═══════════════════════════════════════
       多游戏：总目录、工具栏、状态页
       ═══════════════════════════════════════ */
    body.hub-mode .sidebar,
    body.hub-mode .menu-toggle,
    body.hub-mode .overlay { display: none; }
    body.hub-mode .main { margin-left: 0; }
    body.hub-mode .content { max-width: 1040px; }

    .hub { padding: 56px 24px 80px; }
    .hub-head h1 { font-size: 1.9rem; margin-bottom: 10px; }
    .hub-head p { color: var(--color-text-secondary); margin-bottom: 32px; }
    .hub-head code, .fatal code, .noscript-box code {
      background: var(--color-accent-soft); color: #2563eb;
      padding: 2px 6px; border-radius: 4px; font-size: 0.92em;
    }
    .hub-grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
    .game-card {
      background: var(--color-card); border: 1px solid var(--color-border);
      border-radius: 14px; padding: 22px 22px 18px;
      display: flex; flex-direction: column; gap: 12px;
      transition: box-shadow var(--transition-speed), transform var(--transition-speed);
    }
    .game-card:hover { box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08); transform: translateY(-2px); }
    .game-card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .game-card-head h2 { font-size: 1.15rem; }
    .chip {
      display: inline-block; font-size: 0.75rem; padding: 2px 9px; border-radius: 999px;
      background: var(--color-accent-soft); color: #2563eb; border: 1px solid #dbeafe;
    }
    .chip-warn { background: #fff7ed; color: #c2410c; border-color: #fed7aa; }
    .game-meta { font-size: 0.82rem; color: var(--color-text-secondary); }
    .game-docs { list-style: none; display: flex; flex-direction: column; gap: 2px; }
    .game-docs a {
      color: var(--color-text); text-decoration: none; font-size: 0.92rem;
      padding: 7px 0 7px 2px; border-bottom: 1px dashed var(--color-border); display: block;
    }
    .game-docs a:hover { color: var(--color-link); }
    .btn {
      display: inline-block; align-self: flex-start; background: var(--color-sidebar-active);
      color: #fff; text-decoration: none; font-size: 0.9rem; padding: 8px 18px;
      border-radius: 8px; transition: background var(--transition-speed);
    }
    .btn:hover { background: #2563eb; color: #fff; }
    .btn-ghost { background: transparent; color: var(--color-text); border: 1px solid var(--color-border); margin-left: 8px; }
    .btn-ghost:hover { background: #f1f5f9; color: var(--color-text); }

    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin-bottom: 18px;
    }
    .toolbar-label { font-size: 0.85rem; color: var(--color-text-secondary); display: inline-flex; align-items: center; gap: 8px; }
    .select {
      font: inherit; font-size: 0.85rem; padding: 6px 10px; border-radius: 8px;
      border: 1px solid var(--color-border); background: var(--color-card); color: var(--color-text);
    }
    .toolbar-link { font-size: 0.85rem; color: var(--color-link); text-decoration: none; }

    .loading { color: var(--color-text-secondary); padding: 40px 0; text-align: center; }
    .fatal { max-width: 760px; margin: 0 auto; padding: 72px 24px; }
    .fatal h1 { font-size: 1.5rem; margin-bottom: 14px; }
    .fatal p { color: var(--color-text-secondary); margin-bottom: 12px; }
    .fatal-hint { font-size: 0.85rem; }
    .fatal-inline { padding: 32px 0; margin: 0; }

    .sidebar-footer a { color: var(--color-sidebar-text); text-decoration: none; }
    .sidebar-footer a:hover { color: #fff; }

    .noscript-box { margin-left: var(--sidebar-width); padding: 48px 24px; max-width: 860px; }
    .noscript-box h2 { margin-bottom: 12px; }
    .noscript-box p { color: var(--color-text-secondary); margin-bottom: 14px; }
    .noscript-box ul { margin: 0 0 14px 22px; }
    .noscript-box li { margin-bottom: 4px; }
  </style>
</head>
<body>
  <!-- 汉堡菜单按钮（移动端） -->
  <button class="menu-toggle" id="menuToggle" aria-label="菜单">☰</button>
  <div class="overlay" id="overlay" aria-hidden="true"></div>

  <!-- ── 侧边栏 ── -->
  <aside class="sidebar" id="sidebar" aria-label="文档导航">
    <div class="sidebar-header">
      <h2 id="gameName">📋 法律文档</h2>
      <p id="gameSub">正在读取…</p>
    </div>
    <ul class="sidebar-nav" id="sidebarNav">
      <!-- 由 JS 动态填充 -->
    </ul>
    <div class="sidebar-footer" id="sidebarFooter"></div>
  </aside>

  <!-- ── 主内容区 ── -->
  <main class="main">
    <div class="content" id="content">
      <!-- 由 JS 动态渲染 -->
    </div>
  </main>
  <noscript>
    <div class="noscript-box">
      <h2>需要启用 JavaScript</h2>
      <p>本页通过脚本读取 <code>manifest.json</code> 并加载对应的 Markdown 文档。
         JavaScript 被禁用时，可直接访问下列原始文件：</p>
      <ul>
        <li><a href="manifest.json">manifest.json（全部文档索引）</a></li>
        <li>ModuleWarShip（方块战舰）
          <ul>
            <li><a href="docs/modulewarship/2026-05-28/privacy.md">隐私政策 · 2026-05-28</a></li>
            <li><a href="docs/modulewarship/2026-05-28/terms.md">用户服务协议 · 2026-05-28</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </noscript>

  <script>
    (function () {
      'use strict';

      /* ═══════════════════════════════════════════════
         配置与状态
         — 页面不再内联正文：一切以 manifest.json 为索引
         ═══════════════════════════════════════════════ */
      var MANIFEST_URL = 'manifest.json';
      var HUB_TITLE = '法律文档';

      var state = {
        manifest: null,
        cache: Object.create(null)   // "file@version" → md 文本
      };

      /* DOM 引用 */
      var contentEl     = document.getElementById('content');
      var sidebarNav    = document.getElementById('sidebarNav');
      var sidebar       = document.getElementById('sidebar');
      var menuToggle    = document.getElementById('menuToggle');
      var overlay       = document.getElementById('overlay');
      var gameNameEl    = document.getElementById('gameName');
      var gameSubEl     = document.getElementById('gameSub');
      var sidebarFooterEl = document.getElementById('sidebarFooter');

      /* ═══════════════════════════════════════════════
         通用工具
         ═══════════════════════════════════════════════ */
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function currentParams() {
        return new URLSearchParams(window.location.search);
      }

      /* 由对象拼查询串，值为空的键省略 */
      function queryUrl(params) {
        var usp = new URLSearchParams();
        Object.keys(params).forEach(function (k) {
          if (params[k]) usp.set(k, params[k]);
        });
        var s = usp.toString();
        return s ? '?' + s : './';
      }

      function fetchText(url, opts) {
        return fetch(url, opts || { cache: 'no-cache' }).then(function (r) {
          if (!r.ok) {
            var e = new Error('HTTP ' + r.status + (r.statusText ? ' ' + r.statusText : ''));
            e.status = r.status;
            throw e;
          }
          return r.text();
        });
      }

      function showLoading(text) {
        contentEl.innerHTML = '<div class="loading">' + esc(text || '加载中…') + '</div>';
      }

      /* ═══════════════════════════════════════════════
         manifest 解析
         ═══════════════════════════════════════════════ */
      function loadManifest() {
        return fetchText(MANIFEST_URL + '?t=' + Date.now(), { cache: 'no-store' })
          .then(function (txt) { return JSON.parse(txt); });
      }

      function findGame(id) {
        if (!id || !state.manifest || !state.manifest.games) return null;
        var lower = String(id).toLowerCase();
        return state.manifest.games.filter(function (g) {
          return String(g.id).toLowerCase() === lower;
        })[0] || null;
      }

      /* 版本按日期倒序：新的在前 */
      function gameVersions(game) {
        return (game.versions || []).slice().sort(function (a, b) {
          return a.v < b.v ? 1 : (a.v > b.v ? -1 : 0);
        });
      }

      function latestVersion(game) {
        return gameVersions(game)[0] || null;
      }

      function resolveVersion(game, v) {
        if (v) {
          var hit = gameVersions(game).filter(function (x) { return x.v === v; })[0];
          if (hit) return hit;
        }
        return latestVersion(game);
      }

      function findDoc(version, docId) {
        if (!docId || !version || !version.docs) return null;
        return version.docs.filter(function (d) { return d.id === docId; })[0] || null;
      }

      /* ═══════════════════════════════════════════════
         侧边栏
         ═══════════════════════════════════════════════ */
      function buildSidebar(game, version, activeDocId) {
        var docs = (version && version.docs) || [];
        sidebarNav.innerHTML = docs.map(function (d) {
          var href = queryUrl({
            id: game.id,
            doc: d.id,
            v: version.v === game.latest ? null : version.v
          });
          var cls = d.id === activeDocId ? ' class="active"' : '';
          return '<li><a href="' + esc(href) + '"' + cls + '>' + esc(d.title) + '</a></li>';
        }).join('');
      }

      function setSidebarHeader(title, sub) {
        if (gameNameEl) gameNameEl.textContent = '📋 ' + title;
        if (gameSubEl) gameSubEl.textContent = sub;
      }

      function setSidebarFooter(html) {
        if (sidebarFooterEl) sidebarFooterEl.innerHTML = html;
      }

      function closeSidebar() {
        if (!sidebar || !overlay) return;
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
      }

      /* ═══════════════════════════════════════════════
         渲染：总目录（无 id 时）
         ═══════════════════════════════════════════════ */
      function renderHub(manifest) {
        var games = manifest.games || [];
        var cards = games.map(function (game) {
          var ver = latestVersion(game);
          var docs = (ver && ver.docs) || [];
          var items = docs.map(function (d) {
            return '<li><a href="' + esc(queryUrl({ id: game.id, doc: d.id })) + '">' +
                   esc(d.title) + '</a></li>';
          }).join('');
          var meta = [];
          if (ver) {
            meta.push('最新版本 ' + esc(ver.v));
            if (ver.effective) meta.push('生效 ' + esc(ver.effective));
          }
          meta.push(docs.length + ' 篇文档');
          return '<article class="game-card">' +
            '<div class="game-card-head"><h2>' + esc(game.name) + '</h2>' +
              (game.name_zh ? '<span class="chip">' + esc(game.name_zh) + '</span>' : '') +
            '</div>' +
            '<p class="game-meta">' + meta.join(' · ') + '</p>' +
            '<ul class="game-docs">' + items + '</ul>' +
            '<a class="btn" href="' + esc(queryUrl({ id: game.id })) + '">进入 →</a>' +
          '</article>';
        }).join('');

        contentEl.innerHTML =
          '<div class="hub">' +
            '<header class="hub-head">' +
              '<h1>法律文档</h1>' +
              '<p>本页是总索引。对外的正式链接请使用带 <code>?id=</code> 的地址：' +
                '指定游戏后，页面只显示该游戏自己的文档。</p>' +
            '</header>' +
            '<div class="hub-grid">' + cards + '</div>' +
          '</div>';

        document.title = HUB_TITLE;
        setSidebarHeader(HUB_TITLE, '共 ' + games.length + ' 个游戏');
        setSidebarFooter('选择游戏后显示对应文档');
      }

      /* ═══════════════════════════════════════════════
         渲染：单篇文档
         ═══════════════════════════════════════════════ */
      function versionBar(game, version) {
        var versions = gameVersions(game);
        if (versions.length < 2) return '';

        var opts = versions.map(function (x) {
          var label = '版本 ' + x.v;
          if (x.effective && x.effective !== x.v) label += '（生效 ' + x.effective + '）';
          return '<option value="' + esc(x.v) + '"' +
                 (x.v === version.v ? ' selected' : '') + '>' + esc(label) + '</option>';
        }).join('');

        return '<div class="toolbar">' +
          '<label class="toolbar-label">版本' +
            '<select id="versionSelect" class="select">' + opts + '</select>' +
          '</label>' +
          '<a class="toolbar-link" href="./">全部游戏</a>' +
        '</div>';
      }

      function renderDoc(doc, version, game, mdText) {
        var parts = [];
        if (version.v) parts.push('<span class="meta-version">版本 ' + esc(version.v) + '</span>');
        if (version.effective) parts.push('<span class="meta-date">生效 ' + esc(version.effective) + '</span>');
        if (version.v !== game.latest) parts.push('<span class="chip chip-warn">历史版本</span>');

        var metaHTML = parts.length ? '<div class="meta-bar">' + parts.join('') + '</div>' : '';
        var bodyHTML = '<div class="markdown-body fade-in">' + renderMarkdown(mdText) + '</div>';

        contentEl.innerHTML = versionBar(game, version) + metaHTML + bodyHTML;
        document.title = game.name + ' · ' + doc.title;

        var sel = document.getElementById('versionSelect');
        if (sel) {
          sel.addEventListener('change', function () {
            var p = currentParams();
            p.set('v', sel.value);
            window.location.search = p.toString();
          });
        }
      }

      /* ═══════════════════════════════════════════════
         渲染：错误与空态
         ═══════════════════════════════════════════════ */
      function renderUnknownGame(id) {
        contentEl.innerHTML =
          '<div class="fatal">' +
            '<h1>未找到该游戏</h1>' +
            '<p>地址里的 <code>id=' + esc(id) + '</code> 不在 <code>manifest.json</code> 中。</p>' +
            '<p class="fatal-hint">如果是通过应用内链接进入，请确认链接是否完整；' +
              '这里刻意不回退到总目录，以免把别的游戏的政策当成这一份。</p>' +
            '<p><a class="btn" href="./">查看全部游戏</a>' +
              '<a class="btn btn-ghost" href="manifest.json" target="_blank" rel="noopener">文档索引</a></p>' +
          '</div>';
        document.title = '未找到该游戏';
        setSidebarHeader('未找到', 'id=' + id);
        setSidebarFooter('');
        sidebarNav.innerHTML = '';
      }

      function renderUnknownDoc(game, version, docId) {
        var docs = (version && version.docs) || [];
        var links = docs.map(function (d) {
          return '<li><a href="' + esc(queryUrl({ id: game.id, doc: d.id })) + '">' + esc(d.title) + '</a></li>';
        }).join('');
        contentEl.innerHTML =
          '<div class="fatal fatal-inline">' +
            '<h1>该版本没有这篇文档</h1>' +
            '<p><code>doc=' + esc(docId) + '</code> 在版本 <code>' + esc(version.v) + '</code> 下不存在。</p>' +
            '<ul class="game-docs">' + links + '</ul>' +
          '</div>';
        document.title = game.name + ' · 未找到文档';
        buildSidebar(game, version, null);
      }

      function renderDocError(doc, err) {
        var detail = (err && err.status) ? ('HTTP ' + err.status)
          : (err && err.message ? err.message : '未知错误');
        contentEl.innerHTML =
          '<div class="fatal fatal-inline">' +
            '<h1>该文档暂时无法加载</h1>' +
            '<p>' + esc(doc.title) + '（<code>' + esc(doc.file) + '</code>）加载失败：' + esc(detail) + '</p>' +
            '<p class="fatal-hint">若通过 <code>file://</code> 直接打开本页，浏览器会拦截读取 md 文件，' +
              '请改用 HTTP 服务或线上地址。</p>' +
            '<p><a class="btn btn-ghost" href="' + esc(doc.file) + '" target="_blank" rel="noopener">直接查看原始文件</a>' +
              '<a class="btn btn-ghost" href="./">全部游戏</a></p>' +
          '</div>';
        document.title = '文档加载失败';
      }

      function renderManifestError(err) {
        var detail = (err && err.message) ? err.message : '';
        contentEl.innerHTML =
          '<div class="fatal">' +
            '<h1>无法读取文档索引</h1>' +
            '<p><code>manifest.json</code> 加载失败：' + esc(detail) + '</p>' +
            '<p class="fatal-hint">若通过 <code>file://</code> 打开本页，请改用 HTTP 服务或线上地址。</p>' +
            '<p><a class="btn btn-ghost" href="manifest.json" target="_blank" rel="noopener">直接查看 manifest.json</a></p>' +
          '</div>';
        document.title = '加载失败';
      }

      /* ═══════════════════════════════════════════════
         路由
         ═══════════════════════════════════════════════ */
      function route() {
        var p = currentParams();
        var id = p.get('id');
        var isHub = !id;

        document.body.classList.toggle('hub-mode', isHub);

        if (!state.manifest) return;

        if (isHub) {
          renderHub(state.manifest);
          return;
        }

        var game = findGame(id);
        if (!game) {
          renderUnknownGame(id);
          return;
        }

        var version = resolveVersion(game, p.get('v'));
        if (!version) {
          renderUnknownGame(id);
          return;
        }

        var wantDoc = p.get('doc');
        var doc = findDoc(version, wantDoc);

        /* 侧栏头/脚 */
        setSidebarHeader(game.name, (version.docs || []).length + ' 篇文档 · ' + version.v);
        setSidebarFooter('<a href="./">← 全部游戏</a>');
        buildSidebar(game, version, doc ? doc.id : null);

        if (wantDoc && !doc) {
          renderUnknownDoc(game, version, wantDoc);
          return;
        }

        doc = doc || (version.docs || [])[0];
        if (!doc) {
          contentEl.innerHTML = '<div class="error-msg">该版本下没有可用文档</div>';
          document.title = game.name;
          return;
        }

        /* 规范化 URL：补全 doc、去掉多余参数 */
        try {
          var cp = new URLSearchParams();
          cp.set('id', game.id);
          cp.set('doc', doc.id);
          if (version.v !== game.latest) cp.set('v', version.v);
          history.replaceState(null, '', '?' + cp.toString());
        } catch (e) { /* file:// 下可能受限，忽略 */ }

        showLoading('正在加载 ' + doc.title + '…');

        var key = doc.file + '@' + version.v;
        var loading = state.cache[key]
          ? Promise.resolve(state.cache[key])
          : fetchText(doc.file + '?v=' + encodeURIComponent(version.v))
              .then(function (txt) { state.cache[key] = txt; return txt; });

        loading.then(function (md) {
          var now = currentParams();
          if (now.get('id') !== game.id || now.get('doc') !== doc.id) return;
          renderDoc(doc, version, game, md);
        }).catch(function (err) {
          renderDocError(doc, err);
        });
      }

      /* ═══════════════════════════════════════════════
         初始化
         ═══════════════════════════════════════════════ */
      function boot() {
        var p = currentParams();
        document.body.classList.toggle('hub-mode', !p.get('id'));

        showLoading('正在读取文档索引…');

        loadManifest().then(function (m) {
          if (!m || !Array.isArray(m.games)) {
            throw new Error('manifest.json 结构不正确（缺少 games 数组）');
          }
          state.manifest = m;
          route();
        }).catch(function (err) {
          renderManifestError(err);
        });
      }

      /* 移动端侧边栏 —— 事件绑定（DOM 已就绪，脚本位于 body 末尾） */
      if (menuToggle) {
        menuToggle.addEventListener('click', function () {
          sidebar.classList.toggle('open');
          overlay.classList.toggle('show');
        });
      }
      if (overlay) overlay.addEventListener('click', closeSidebar);
      if (sidebarNav) {
        sidebarNav.addEventListener('click', function (e) {
          if (e.target.tagName === 'A') setTimeout(closeSidebar, 120);
        });
      }

      /* ═══════════════════════════════════════════════
         内建 Markdown 渲染器
         零外部依赖，处理本项目的所有 markdown 语法
         ═══════════════════════════════════════════════ */
      function renderMarkdown(md) {
        // 1. HTML 转义
        var html = md
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');

        // 2. 按行处理，逐行构建 HTML
        var lines = html.split('\n');
        var out = [];
        var inCodeBlock = false;
        var codeBuffer = [];

        function flushCodeBlock() {
          if (codeBuffer.length) {
            out.push('<pre><code>' + codeBuffer.join('\n') + '</code></pre>');
            codeBuffer = [];
          }
        }

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];

          // ── 代码块 ``` ──
          if (/^```/.test(line)) {
            if (inCodeBlock) {
              out.push('<pre><code>' + codeBuffer.join('\n') + '</code></pre>');
              codeBuffer = [];
              inCodeBlock = false;
            } else {
              flushCodeBlock();
              inCodeBlock = true;
            }
            continue;
          }

          if (inCodeBlock) {
            codeBuffer.push(line);
            continue;
          }

          // ── 空行 ──
          if (line.trim() === '') {
            flushCodeBlock();
            out.push('');
            continue;
          }

          // ── 水平线 --- ──
          if (/^---+\s*$/.test(line)) {
            out.push('<hr>');
            continue;
          }

          // ── Headings ──
          var hMatch = line.match(/^(#{1,3})\s+(.+)$/);
          if (hMatch) {
            var level = hMatch[1].length;
            var text = inlineFormat(hMatch[2]);
            out.push('<h' + level + '>' + text + '</h' + level + '>');
            continue;
          }

          // ── 无序列表 - / * ──
          var ulMatch = line.match(/^[-*]\s+(.+)$/);
          if (ulMatch) {
            out.push('<li>' + inlineFormat(ulMatch[1]) + '</li>');
            continue;
          }

          // ── 有序列表 1. / 2. ──
          var olMatch = line.match(/^(\d+)\.\s+(.+)$/);
          if (olMatch) {
            out.push('<li value="' + olMatch[1] + '">' + inlineFormat(olMatch[2]) + '</li>');
            continue;
          }

          // ── Blockquote > ──
          var bqMatch = line.match(/^>\s?(.*)$/);
          if (bqMatch) {
            out.push('<blockquote><p>' + inlineFormat(bqMatch[1]) + '</p></blockquote>');
            continue;
          }

          // ── 普通段落 ──
          out.push('<p>' + inlineFormat(line) + '</p>');
        }

        flushCodeBlock();

        // 3. 合并列表：将连续的 <li> 包裹在 <ul> 或 <ol> 中
        var merged = out.join('\n');
        merged = merged.replace(/((?:<li[^>]*>.*?<\/li>\n?)+)/g, function (match) {
          // 检测是否包含 value 属性 → 有序列表
          if (/value="\d+"/.test(match)) {
            return '<ol>\n' + match + '</ol>';
          }
          return '<ul>\n' + match + '</ul>';
        });

        return merged;
      }

      /* 行内格式化：**加粗** *斜体* `行内代码` [链接](url) */
      function inlineFormat(text) {
        // 必须按顺序：先转义，再做标记替换
        return text
          // 行内代码 `...`
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          // 粗体 **...**
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          // 斜体 *...*（但不能匹配到粗体区域）
          .replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>')
          // 链接 [text](url)
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      }

      /* ═══════════════════════════════════════════════
         启动
         ═══════════════════════════════════════════════ */
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>

  <style>
    /* ═══════════════════════════════════════
       变量 & 重置
       ═══════════════════════════════════════ */
    :root {
      --sidebar-width: 260px;
      --color-bg: #f8f9fa;
      --color-sidebar: #1e293b;
      --color-sidebar-text: #cbd5e1;
      --color-sidebar-hover: rgba(255, 255, 255, 0.08);
      --color-sidebar-active: #3b82f6;
      --color-text: #1e293b;
      --color-text-secondary: #64748b;
      --color-border: #e2e8f0;
      --color-card: #ffffff;
      --color-link: #3b82f6;
      --color-accent-soft: #eff6ff;
      --max-content-width: 800px;
      --transition-speed: 0.2s;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial,
        sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.8;
      display: flex;
      min-height: 100vh;
    }

    /* ═══════════════════════════════════════
       Sidebar
       ═══════════════════════════════════════ */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--color-sidebar);
      color: var(--color-sidebar-text);
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      overflow-y: auto;
      z-index: 10;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 24px 20px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .sidebar-header h2 {
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .sidebar-header p {
      font-size: 12px;
      margin-top: 4px;
      opacity: 0.6;
    }

    .sidebar-nav {
      flex: 1;
      list-style: none;
      padding: 8px 12px;
    }

    .sidebar-nav li {
      margin-bottom: 2px;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      color: var(--color-sidebar-text);
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      transition: background var(--transition-speed) ease, color var(--transition-speed) ease;
    }

    .sidebar-nav a:hover {
      background: var(--color-sidebar-hover);
      color: #ffffff;
    }

    .sidebar-nav a.active {
      background: var(--color-sidebar-active);
      color: #ffffff;
    }

    /* 导航图标（可选装饰） */
    .sidebar-nav a::before {
      content: "📄";
      font-size: 13px;
      opacity: 0.6;
    }
    .sidebar-nav a.active::before {
      opacity: 1;
    }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 11px;
      opacity: 0.45;
      flex-shrink: 0;
    }

    /* ═══════════════════════════════════════
       Main content area
       ═══════════════════════════════════════ */
    .main {
      margin-left: var(--sidebar-width);
      flex: 1;
      min-width: 0;
    }

    .content {
      max-width: var(--max-content-width);
      margin: 0 auto;
      padding: 40px 32px 80px;
    }

    /* ═══════════════════════════════════════
       Markdown 渲染内容
       ═══════════════════════════════════════ */
    .markdown-body h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #0f172a;
      border-bottom: 2px solid var(--color-border);
      padding-bottom: 12px;
    }

    .markdown-body h2 {
      font-size: 22px;
      font-weight: 600;
      margin-top: 36px;
      margin-bottom: 12px;
      color: #1e293b;
    }

    .markdown-body h3 {
      font-size: 18px;
      font-weight: 600;
      margin-top: 28px;
      margin-bottom: 8px;
      color: #334155;
    }

    .markdown-body p {
      margin-bottom: 12px;
    }

    .markdown-body ul,
    .markdown-body ol {
      margin-bottom: 12px;
      padding-left: 24px;
    }

    .markdown-body li {
      margin-bottom: 4px;
    }

    .markdown-body li > p {
      margin-bottom: 0;
    }

    .markdown-body strong {
      font-weight: 600;
    }

    .markdown-body em {
      font-style: italic;
    }

    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 32px 0;
    }

    .markdown-body blockquote {
      border-left: 3px solid var(--color-sidebar-active);
      padding: 8px 16px;
      margin: 16px 0;
      color: var(--color-text-secondary);
      background: var(--color-accent-soft);
      border-radius: 0 6px 6px 0;
    }

    .markdown-body a {
      color: var(--color-link);
      text-decoration: none;
    }

    .markdown-body a:hover {
      text-decoration: underline;
    }

    .markdown-body code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    .markdown-body pre {
      background: #1e293b;
      color: #e2e8f0;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.5;
    }

    .markdown-body pre code {
      background: transparent;
      padding: 0;
      color: inherit;
      font-size: inherit;
    }

    /* ═══════════════════════════════════════
       元信息栏（版本 / 日期）
       ═══════════════════════════════════════ */
    .meta-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .meta-bar span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 3px 12px;
      font-size: 13px;
      color: var(--color-text-secondary);
      white-space: nowrap;
    }

    .meta-bar span::before {
      font-size: 14px;
    }
    .meta-bar .meta-version::before { content: "🏷️ "; }
    .meta-bar .meta-date::before    { content: "📅 "; }

    /* ═══════════════════════════════════════
       状态提示
       ═══════════════════════════════════════ */
    .info-banner {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #92400e;
      line-height: 1.6;
    }

    .info-banner code {
      background: #fde68a;
      padding: 1px 6px;
      border-radius: 3px;
      font-weight: 600;
      font-size: 0.95em;
    }

    .loading, .error-msg {
      text-align: center;
      padding: 80px 20px;
    }

    .loading {
      color: var(--color-text-secondary);
    }

    .loading::after {
      content: "";
      display: inline-block;
      width: 20px;
      height: 20px;
      margin-left: 8px;
      border: 2px solid var(--color-border);
      border-top-color: var(--color-sidebar-active);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-msg {
      color: #dc2626;
    }

    .error-msg code {
      background: #fef2f2;
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* ═══════════════════════════════════════
       移动端：汉堡菜单
       ═══════════════════════════════════════ */
    .menu-toggle {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 20;
      background: var(--color-sidebar);
      color: #fff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      transition: background var(--transition-speed) ease;
    }

    .menu-toggle:hover {
      background: #334155;
    }

    .menu-toggle:focus-visible {
      outline: 2px solid var(--color-sidebar-active);
      outline-offset: 2px;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 9;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .overlay.show {
      display: block;
      opacity: 1;
    }

    /* ═══════════════════════════════════════
       响应式
       ═══════════════════════════════════════ */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .menu-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .main {
        margin-left: 0;
      }

      .content {
        padding: 56px 16px 40px;
      }

      .markdown-body h1 {
        font-size: 22px;
      }

      .markdown-body h2 {
        font-size: 18px;
      }
    }

    /* ═══════════════════════════════════════
       打印样式
       ═══════════════════════════════════════ */
    @media print {
      .sidebar, .menu-toggle, .overlay, .info-banner {
        display: none !important;
      }
      .main {
        margin-left: 0;
      }
      .content {
        padding: 20px;
        max-width: none;
      }
      body {
        background: #fff;
      }
    }

    /* ═══════════════════════════════════════
       平滑页面切换（内容区域淡入）
       ═══════════════════════════════════════ */
    .fade-in {
      animation: fadeIn 0.25s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

            "如您对本协议有任何疑问，请通过以下方式联系我们：",
            "",
            "- **电子邮箱**：support@example.com",
            "- **联系地址**：[公司地址]",
            "",
            "---",
            "",
            "*本协议最终解释权归本公司所有。*"
          ].join("\n")
        }
      ];

      /* ═══════════════════════════════════════════════
         内建 Markdown 渲染器
         零外部依赖，处理本项目的所有 markdown 语法
         ═══════════════════════════════════════════════ */
      function renderMarkdown(md) {
        // 1. HTML 转义
        var html = md
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');

        // 2. 按行处理，逐行构建 HTML
        var lines = html.split('\n');
        var out = [];
        var inCodeBlock = false;
        var codeBuffer = [];

        function flushCodeBlock() {
          if (codeBuffer.length) {
            out.push('<pre><code>' + codeBuffer.join('\n') + '</code></pre>');
            codeBuffer = [];
          }
        }

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];

          // ── 代码块 ``` ──
          if (/^```/.test(line)) {
            if (inCodeBlock) {
              out.push('<pre><code>' + codeBuffer.join('\n') + '</code></pre>');
              codeBuffer = [];
              inCodeBlock = false;
            } else {
              flushCodeBlock();
              inCodeBlock = true;
            }
            continue;
          }

          if (inCodeBlock) {
            codeBuffer.push(line);
            continue;
          }

          // ── 空行 ──
          if (line.trim() === '') {
            flushCodeBlock();
            out.push('');
            continue;
          }

          // ── 水平线 --- ──
          if (/^---+\s*$/.test(line)) {
            out.push('<hr>');
            continue;
          }

          // ── Headings ──
          var hMatch = line.match(/^(#{1,3})\s+(.+)$/);
          if (hMatch) {
            var level = hMatch[1].length;
            var text = inlineFormat(hMatch[2]);
            out.push('<h' + level + '>' + text + '</h' + level + '>');
            continue;
          }

          // ── 无序列表 - / * ──
          var ulMatch = line.match(/^[-*]\s+(.+)$/);
          if (ulMatch) {
            out.push('<li>' + inlineFormat(ulMatch[1]) + '</li>');
            continue;
          }

          // ── 有序列表 1. / 2. ──
          var olMatch = line.match(/^(\d+)\.\s+(.+)$/);
          if (olMatch) {
            out.push('<li value="' + olMatch[1] + '">' + inlineFormat(olMatch[2]) + '</li>');
            continue;
          }

          // ── Blockquote > ──
          var bqMatch = line.match(/^>\s?(.*)$/);
          if (bqMatch) {
            out.push('<blockquote><p>' + inlineFormat(bqMatch[1]) + '</p></blockquote>');
            continue;
          }

          // ── 普通段落 ──
          out.push('<p>' + inlineFormat(line) + '</p>');
        }

        flushCodeBlock();

        // 3. 合并列表：将连续的 <li> 包裹在 <ul> 或 <ol> 中
        var merged = out.join('\n');
        merged = merged.replace(/((?:<li[^>]*>.*?<\/li>\n?)+)/g, function (match) {
          // 检测是否包含 value 属性 → 有序列表
          if (/value="\d+"/.test(match)) {
            return '<ol>\n' + match + '</ol>';
          }
          return '<ul>\n' + match + '</ul>';
        });

        return merged;
      }

      /* 行内格式化：**加粗** *斜体* `行内代码` [链接](url) */
      function inlineFormat(text) {
        // 必须按顺序：先转义，再做标记替换
        return text
          // 行内代码 `...`
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          // 粗体 **...**
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          // 斜体 *...*（但不能匹配到粗体区域）
          .replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>')
          // 链接 [text](url)
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      }

      /* ═══════════════════════════════════════════════
         DOM 引用
         ═══════════════════════════════════════════════ */
      var contentEl  = document.getElementById('content');
      var sidebarNav = document.getElementById('sidebarNav');
      var sidebar    = document.getElementById('sidebar');
      var menuToggle = document.getElementById('menuToggle');
      var overlay    = document.getElementById('overlay');

      /* ═══════════════════════════════════════════════
         工具函数
         ═══════════════════════════════════════════════ */
      function getQueryId() {
        var params = new URLSearchParams(window.location.search);
        return params.get('id');
      }

      function isFileProtocol() {
        return window.location.protocol === 'file:';
      }

      /* ═══════════════════════════════════════════════
         渲染文档
         ═══════════════════════════════════════════════ */
      function renderDoc(doc) {
        // 构建元信息栏
        var metaParts = [];
        if (doc.version) {
          metaParts.push('<span class="meta-version">版本 ' + doc.version + '</span>');
        }
        if (doc.updated) {
          metaParts.push('<span class="meta-date">更新于 ' + doc.updated + '</span>');
        }
        var metaHTML = metaParts.length ? '<div class="meta-bar">' + metaParts.join('') + '</div>' : '';

        // file:// 协议提示
        var banner = '';
        if (isFileProtocol()) {
          banner = '<div class="info-banner">💡 当前通过 <code>file://</code> 协议打开，内容已内联加载，无需 HTTP 服务。要预览完整效果，也可运行 <code>python -m http.server 8080</code> 后访问 <code>http://localhost:8080</code></div>';
        }

        // 渲染 markdown
        var bodyHTML = '<div class="markdown-body fade-in">' + renderMarkdown(doc.content) + '</div>';

        contentEl.innerHTML = banner + metaHTML + bodyHTML;
        document.title = doc.title + ' — 隐私政策 / 用户服务协议';
      }

      function renderError(msg) {
        contentEl.innerHTML = '<div class="error-msg">' + msg + '</div>';
      }

      /* ═══════════════════════════════════════════════
         构建侧边栏
         ═══════════════════════════════════════════════ */
      function buildSidebar(docs, activeId) {
        sidebarNav.innerHTML = docs.map(function (d) {
          var cls = d.id === activeId ? ' class="active"' : '';
          return '<li><a href="?id=' + encodeURIComponent(d.id) + '"' + cls + '>' + d.title + '</a></li>';
        }).join('');
      }

      function updateSidebarActive(activeId) {
        var links = sidebarNav.querySelectorAll('a');
        links.forEach(function (link) {
          link.classList.toggle('active', link.getAttribute('href') === '?id=' + encodeURIComponent(activeId));
        });
      }

      /* ═══════════════════════════════════════════════
         移动端侧边栏控制
         ═══════════════════════════════════════════════ */
      function closeSidebar() {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
      }

      menuToggle.addEventListener('click', function () {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
      });

      overlay.addEventListener('click', closeSidebar);

      sidebarNav.addEventListener('click', function (e) {
        if (e.target.tagName === 'A') {
          setTimeout(closeSidebar, 150);
        }
      });

      /* ═══════════════════════════════════════════════
         加载指定文档
         ═══════════════════════════════════════════════ */
      function loadDoc(id, docs) {
        // 查找文档，找不到则用第一篇
        var doc = null;
        if (id) {
          doc = docs.filter(function (d) { return d.id === id; })[0];
        }
        if (!doc) {
          doc = docs[0];
        }

        if (!doc) {
          renderError('没有可用的文档');
          return;
        }

        // 更新 URL（不刷新页面）
        var currentId = getQueryId();
        if (doc.id !== currentId) {
          var url = new URL(window.location);
          url.searchParams.set('id', doc.id);
          window.history.replaceState(null, '', url);
        }

        // 更新侧边栏高亮
        updateSidebarActive(doc.id);

        // 渲染内容
        renderDoc(doc);
      }

      /* ═══════════════════════════════════════════════
         初始化
         ═══════════════════════════════════════════════ */
      function init() {
        if (!DOCS || DOCS.length === 0) {
          renderError('没有配置任何文档');
          return;
        }

        var queryId = getQueryId();
        var activeId = queryId && DOCS.some(function (d) { return d.id === queryId; }) ? queryId : DOCS[0].id;

        buildSidebar(DOCS, activeId);
        loadDoc(activeId, DOCS);
      }

      // DOMContentLoaded 后初始化
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
